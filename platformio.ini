; PlatformIO Project Configuration File for ESP32 WROOM-32 (4MB Flash)
; Milesight UG56 Style LoRaWAN AS923-2 Multi-Task FreeRTOS Gateway with WireGuard VPN

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio

upload_protocol = esptool
upload_speed = 921600
; Tu dong quet va nhan dien cong COM (Auto-detect serial port)
; upload_port = COM...
; monitor_port = COM...

build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.3.0
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    knolleary/PubSubClient @ ^2.8
